<title>Prepa Kombat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: menu en una columna (fichas de peleador + ficha de movimientos); juego = marcador, escenario 16:9 y botones tactiles. Look unico y oscuro a proposito: es una pantalla de arcade con el amarillo de las bancas del patio. */
  --ink:#12162b; --ink-2:#1b2145; --ink-3:#252d5e; --line:#323b70;
  --text:#f2f3fb; --muted:#a2a9d6;
  --bench:#f5b800; --bench-text:#251b00; --alert:#ff6a5c;
  --fer:#ff9a3c; --jul:#62a8ff; --yis:#7fe0a6;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:12px;padding-bottom:12px;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{font-family:var(--display);font-weight:400;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bench);outline-offset:2px}

/* ---------- menu ---------- */
#menu{max-width:620px;margin:0 auto;display:grid;gap:18px}
.brand h1{margin:0;font-size:clamp(34px,10vw,54px);line-height:.95;color:var(--bench);letter-spacing:.01em}
.brand p{margin:8px 0 0;color:var(--muted);max-width:44ch}
#menu h2{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.pick{appearance:none;background:var(--ink-2);border:2px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.pick canvas{width:100%;max-width:76px;height:auto;aspect-ratio:80/96;display:block}
.pick b{font-family:var(--display);font-size:13px;font-weight:400;letter-spacing:.02em}
.pick[aria-checked="true"]{border-color:var(--c);background:var(--ink-3);box-shadow:inset 0 0 0 2px var(--c)}
.ficha{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:grid;gap:8px}
.ficha h3{margin:0;font-size:24px;color:var(--c)}
.ficha .tag{margin:0;font-weight:700;color:var(--text)}
.ficha .desc{margin:0;color:var(--muted)}
.moves{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:7px}
.moves li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:baseline}
.moves kbd{font-family:var(--display);font-size:11px;background:var(--bench);color:var(--bench-text);border-radius:6px;padding:3px 0;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{appearance:none;background:var(--ink-2);border:2px solid var(--line);border-radius:12px;padding:11px 8px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--bench);background:var(--ink-3);color:var(--bench)}
.hint{margin:8px 0 0;color:var(--muted);font-size:14px}
.go{appearance:none;border:0;border-radius:14px;background:var(--bench);color:var(--bench-text);font-family:var(--display);font-size:22px;padding:16px;cursor:pointer;box-shadow:0 5px 0 #a87d00}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a87d00}

/* ---------- seleccion ---------- */
#menu{max-width:640px;margin:0 auto;display:grid;gap:14px;padding-top:6px}
.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.slot{appearance:none;border:3px solid var(--bench);background:var(--ink-2);border-radius:16px;aspect-ratio:1/1.1;display:grid;place-items:end center;cursor:pointer;padding:6px;overflow:hidden;--c:var(--bench)}
.slot.r{border-color:var(--alert);--c:var(--alert)}
.slot.on{box-shadow:0 0 0 4px var(--c),0 0 24px var(--c)}
.slot canvas{width:78%;height:auto;aspect-ratio:80/96;display:block}
.modes{display:grid;gap:8px}
.modes button{appearance:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.modes svg{width:28px;height:28px;fill:var(--muted)}
.modes button[aria-pressed="true"]{border-color:var(--bench);background:var(--ink-3)}
.modes button[aria-pressed="true"] svg{fill:var(--bench)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.pick{position:relative;appearance:none;background:var(--ink-2);border:3px solid var(--line);border-radius:14px;padding:8px 4px 4px;display:grid;place-items:end center;cursor:pointer;min-width:0;aspect-ratio:1/1.1}
.pick canvas{width:86%;height:auto;aspect-ratio:80/96;display:block}
.pick:hover{border-color:var(--c)}
.pick .tag{position:absolute;top:6px;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pick .t0{left:6px;background:var(--bench)}.pick .t1{right:6px;background:var(--alert)}
.pick.p0{border-color:var(--bench)}.pick.p1{border-color:var(--alert)}
/* ---------- juego ---------- */
#game{max-width:1100px;margin:0 auto;display:grid;gap:8px;justify-items:center}
.hud{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.pl{background:var(--ink-2);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:4px 10px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"pt pc" "pt st" "ub ub";column-gap:10px;align-items:center;min-width:0}
.pl.r{border-left:1px solid var(--line);border-right:5px solid var(--c);text-align:right;grid-template-columns:1fr auto;grid-template-areas:"pc pt" "st pt" "ub ub"}
.pl .pt{grid-area:pt;width:34px;height:auto;aspect-ratio:80/96;display:block}
.pl .pc{grid-area:pc;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pl .pc small{font-size:14px}
.pl .st{grid-area:st;color:var(--c);letter-spacing:.12em;font-size:12px}
.pl .ub{grid-area:ub;height:7px;border-radius:4px;background:var(--ink);margin-top:4px;overflow:hidden}
.pl .ub i{display:block;height:100%;width:0;background:var(--c);transition:width .1s}
.pl .ub.full i{background:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{opacity:.45}}
.hudbtns{display:grid;gap:6px;align-content:center}
.mini{appearance:none;background:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
.field{position:relative;line-height:0}
#cv{display:block;border-radius:10px;background:#8fa9c0;touch-action:none}
#over{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:rgba(10,12,28,.72);border-radius:10px;line-height:1.3;padding:16px}
#over h2{margin:0;font-size:clamp(26px,7vw,52px);color:var(--c)}
#over p{margin:0;color:var(--muted)}
#over .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#over .row button{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--ink-3);border:1px solid var(--line)}
#over .row button.main{background:var(--bench);color:var(--bench-text);border-color:var(--bench)}
.keys{margin:0;color:var(--muted);font-size:13px;text-align:center}
body.touch .keys{display:none}

/* ---------- controles tactiles ---------- */
.pad{display:none;width:100%;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
body.touch .pad{display:flex}
body:not(.two) #pad2{display:none!important}
body.two #pad2{transform:rotate(180deg)}
.cl{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
.cr{display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:repeat(3,52px);gap:6px}
.b.ult{background:#ff6a5c;border-color:#ff6a5c;color:#220906;border-radius:26px}
.b.ult.on{background:#fff}
.b{appearance:none;border:2px solid var(--line);background:rgba(37,45,94,.92);color:var(--text);border-radius:50%;display:grid;place-items:center;touch-action:none;cursor:pointer;font-family:var(--display);font-size:11px;padding:0;line-height:1}
.b.on{background:var(--bench);color:var(--bench-text);border-color:var(--bench);transform:scale(.94)}
.b svg{width:26px;height:26px;fill:currentColor}
.b{position:relative}
.b .ar{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:10px;line-height:1}
.mini svg{width:20px;height:20px;fill:currentColor;display:block;margin:0 auto}
.mini{min-width:44px}
#snd[aria-pressed="false"] .w{display:none}
#over canvas{width:min(34%,150px);height:auto;aspect-ratio:160/192}
#over .row button svg{width:26px;height:26px;fill:currentColor;display:block}
.b.u svg{transform:rotate(90deg)}.b.d svg{transform:rotate(-90deg)}.b.rt svg{transform:rotate(180deg)}
.b.a{background:rgba(245,184,0,.92);color:var(--bench-text);border-color:var(--bench)}
.b.a.on{background:#fff}
.cl .bl{grid-column:1;grid-row:1}.cl .u{grid-column:2;grid-row:1}.cl .lf{grid-column:1;grid-row:2}.cl .d{grid-column:2;grid-row:2}.cl .rt{grid-column:3;grid-row:2}
@media (orientation:landscape) and (max-height:520px){
  body.touch .pad{position:fixed;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
  body.touch .pad .b{pointer-events:auto;opacity:.88}
  body.two #pad{right:auto;width:47%;justify-content:flex-start;gap:8px}
  body.two #pad2{left:auto;right:0;width:47%;transform:none;flex-direction:row-reverse;justify-content:flex-start;gap:8px}
  body.two .cl{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:5px}
  body.two .cr{grid-template-columns:repeat(2,44px);grid-template-rows:repeat(3,38px);gap:5px}
  body.two .b svg{width:20px;height:20px}
  .cl{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}
  .cr{grid-template-columns:repeat(2,56px);grid-template-rows:repeat(3,44px)}
}
#tower{position:fixed;inset:0;z-index:50;background:#050510;display:grid;place-items:center;cursor:pointer}
#tower[hidden]{display:none!important}
#tower canvas{width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9}
#stages{display:flex;gap:12px;justify-content:center;margin:14px auto 0;flex-wrap:wrap}
#stages[hidden]{display:none!important}
#stages button{appearance:none;border:3px solid var(--line);background:var(--ink-2);border-radius:14px;padding:4px;cursor:pointer;line-height:0}
#stages button:hover,#stages button:focus-visible{border-color:#f5b800;outline:none}
#stages canvas{width:min(30vw,200px);aspect-ratio:16/9;border-radius:9px}
#lobby{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto 0;flex-wrap:wrap}
#lobby[hidden]{display:none!important}
#lobby button{appearance:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
#lobby button svg{width:28px;height:28px;fill:var(--text,#fff)}
#lobby button:disabled{opacity:.4;cursor:default}
#lbCode{font:28px Bungee,Impact,sans-serif;letter-spacing:.18em;color:#ffd84d;min-width:4.4ch;text-align:center}
#lbIn{width:5.6ch;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--ink-2);color:#fff;font:26px Bungee,Impact,sans-serif;text-align:center;text-transform:uppercase;letter-spacing:.1em;padding:0 8px;box-sizing:content-box}
#lbDot{width:14px;height:14px;border-radius:50%;background:#6b7280;display:block}
#lbDot.wait{background:#f5b800;animation:pk 1s infinite}
#lbDot.ok{background:#3ddc84}
#lbDot.err{background:#ff5b5b}
@keyframes pk{50%{opacity:.35}}
#stall{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spn .8s linear infinite;pointer-events:none}
#stall[hidden],#netwarn[hidden]{display:none!important}
#netwarn{position:absolute;top:10px;left:10px;width:30px;height:30px;pointer-events:none}
#netwarn svg{width:100%;height:100%;fill:#f5b800}
@keyframes spn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.go:active,.b.on{transform:none}}
</style>

<main id="menu">
  <div class="slots">
    <button type="button" class="slot" id="slot0" aria-label="Jugador 1"></button>
    <div class="modes" role="group" aria-label="Modo">
      <button type="button" id="m1" aria-pressed="true" aria-label="Un jugador contra la CPU"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-8 8-8s8 3 8 8z"/></svg></button>
      <button type="button" id="m4" aria-pressed="false" aria-label="Torneo"><svg viewBox="0 0 24 24"><path d="M7 3h10v2h3v3c0 2.400-1.700 4.300-4 4.800-.600 1.500-1.800 2.600-3 3V18h3v3H8v-3h3v-2.200c-1.200-.400-2.400-1.500-3-3C5.700 12.300 4 10.400 4 8V5h3zm0 4H6v1c0 1 .5 1.900 1.300 2.400A9 9 0 017 7zm10 0c0 1.800-.100 3.400-.300 3.400C17.500 9.900 18 9 18 8V7z"/></svg></button>

      <button type="button" id="m2" aria-pressed="false" aria-label="Dos jugadores"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.4"/><circle cx="16.5" cy="9" r="3.4"/><path d="M1.5 20c0-4 3-6.500 6.500-6.500S14.500 16 14.500 20zM10 20c0-4 3-6.500 6.500-6.500S23 16 23 20z"/></svg></button>
    </div>
    <button type="button" class="slot r" id="slot1" aria-label="Jugador 2"></button>
  </div>
  <div class="picks" id="picks" role="listbox" aria-label="Peleadores"></div>
  <div id="stages" hidden>
    <button type="button" data-s="enp" aria-label="ENP"><canvas width="240" height="135"></canvas></button>
    <button type="button" data-s="lag" aria-label="Lagos"><canvas width="240" height="135"></canvas></button>

  </div>
  <div id="lobby" hidden>
    <button type="button" id="lbHost" aria-label="Crear sala"><svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg></button>
    <output id="lbCode" aria-live="polite"></output>
    <input id="lbIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Código de sala" placeholder="····">
    <button type="button" id="lbJoin" aria-label="Unirse a la sala"><svg viewBox="0 0 24 24"><path d="M5 11h10.200l-4.600-4.600L12 5l7 7-7 7-1.400-1.400 4.600-4.600H5z"/></svg></button>
    <i id="lbDot"></i>
  </div>
</main>

<div id="tower" hidden><canvas width="960" height="540"></canvas></div>
<div id="game" hidden>
  <div class="hud" id="hud">
    <div class="pl" id="hud0"></div>
    <div class="hudbtns">
      <button type="button" class="mini" id="quit" aria-label="Volver a la selección"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></button>
      <button type="button" class="mini" id="snd" aria-label="Sonido" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path class="w" d="M15 8a5 5 0 010 8M17.500 5a9 9 0 010 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>

        <button type="button" class="main" id="again" aria-label="Revancha"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 107.500 10.700l-2-.8A6 6 0 1112 6v3l5-4-5-4z"/></svg></button>

      </div>
    </div>
  </div>

</div>

<script>
(function(){
'use strict';
const W=960,H=540,K=1.5,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=$('cv'); cv.width=W*K; cv.height=H*K;
const mctx=cv.getContext('2d');
let ctx=mctx;

/* ================= datos ================= */
const STAGE={x:190,y:410,w:580,h:140,slope:0};
const PLATS=[{x:262,y:306,w:140},{x:558,y:306,w:140}];
const STG={
  enp:{x:190,y:410,w:580,h:140,slope:0,plats:[{x:262,y:306,w:140},{x:558,y:306,w:140}]},
  lag1:{x:-400,y:440,w:1760,h:140,slope:0,plats:[{x:150,y:342,w:140},{x:670,y:342,w:140}]},
  lag2:{x:210,y:330,w:540,h:30,slope:.25,plats:[]}
};
function applyStage(st){ STAGE.x=st.x; STAGE.y=st.y; STAGE.w=st.w; STAGE.h=st.h; STAGE.slope=st.slope||0; PLATS.length=0; (st.plats||[]).forEach(p=>PLATS.push({x:p.x,y:p.y,w:p.w})); }
function gy(x){ return STAGE.slope?STAGE.y+STAGE.slope*(x-(STAGE.x+STAGE.w/2)):STAGE.y; }
const GR=.56;
const CH={
  fer:{name:'Fer',color:'#ff9a3c',speed:3.7,jump:12.9,weight:1.1},
  jul:{name:'Julián',color:'#62a8ff',speed:4.8,jump:13.6,weight:.92},
  yis:{name:'Yisus',color:'#7fe0a6',speed:4.1,jump:13.2,weight:1.0},
  seb:{name:'Sebastián',color:'#ff7bb0',speed:4.3,jump:13.4,weight:.97},
  lin:{name:'Linnette',color:'#c28bff',speed:4.4,jump:13.5,weight:.93},
  may:{name:'Maya',color:'#ffd84d',speed:5.5,jump:13.5,weight:.78},
  eps:{name:'El de EPS',color:'#5ec8d8',speed:4.0,jump:13.0,weight:1.03},
  jos:{name:'Josue',color:'#8fa0c4',speed:4.4,jump:13.4,weight:1.0}
};
const ORDER=['fer','jul','yis','seb','lin','may','eps','jos'];
const INST=['Guitarra','Piano','Batería','Violín','Trompeta','Acordeón'];
const INFO={
  fer:{tag:'Gym rat: todo es ganancia muscular',desc:'Come como Kirby, pero en vez de copiar poderes se pone más grande. Cada gain lo hace pegar más duro y lo vuelve más lento y pesado. Si lo sacan del escenario pierde todo el músculo.',
    moves:[['A','Puñetazo. Con más músculo pega mucho más.'],['B','Aspira (mantén B). Si atrapa al rival: A lo escupe, B o ↓ lo traga y gana +1 músculo.'],['↑ B','Sentadilla. Se agacha y sale disparado hacia arriba.'],['↓ B','Pose de pump. Armadura breve y el siguiente golpe sale reforzado.']]},

function burst(x,y,n,col,spd,size){
  for(let i=0;i<n;i++){ const a=rnd(0,TAU), s=rnd(.3,1)*spd; G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.12,life:rnd(16,30),max:30,size:rnd(size*.6,size),col,type:'c'}); }
}

function pop(x,y,txt,col,size){ if(!/^[+−-]\d+%$/.test(txt)) return; G.texts.push({x,y,txt,life:42,max:42,col:col||'#fff',size:size||24}); }

function settle(e,hw,ignorePlat){
  let landed=false;
  if(e.vy>=0&&G.walls) for(const w of G.walls){ const top=w.y-w.h*Math.min(1,w.age/10); if(e.x+hw>w.x&&e.x-hw<w.x+w.w&&e.py<=top+.5&&e.y>=top){ e.y=top; e.vy=0; return 'plat'; } }
  if(e.vy>=0){
    if(e.x+hw>STAGE.x&&e.x-hw<STAGE.x+STAGE.w&&e.py<=gy(e.x)+.5&&e.y>=gy(e.x)){ e.y=gy(e.x); e.vy=0; landed='stage'; }
    else if(!ignorePlat){
      for(let i=0;i<PLATS.length;i++){ const p=PLATS[i];
        if(e.x+hw>p.x&&e.x-hw<p.x+p.w&&e.py<=p.y+.5&&e.y>=p.y){ e.y=p.y; e.vy=0; landed='plat'; break; } }
    }
  }
  return landed;
}
function physics(f){

  const mf=f.fast?19:13.5; if(f.vy>mf) f.vy=mf;

    if(h.cond&&!h.cond(f,a)) return;
    const s=f.s, cx=f.x+f.face*h.ox*s, cy=f.y+h.oy*s, hw=h.w*s/2, hh=h.h*s/2;
    f.fx={cx,cy,w:h.w*s,h:h.h*s};

function doJump(f){
  if(f.onGround){ f.vy=-f.jump*(1-.05*Math.min(5,(f.hair||0))); f.onGround=false; sfx.jump(); burst(f.x,f.y,4,'#ddd',2,3); }

}
function controls(f){
  const i=f.input;
  if(f.ch==='jos') josEdges(f);
  f.blocking=!!(i.block&&!f.act&&f.onGround&&f.guard>0&&!f.swallowed);
  if(f.blocking) f.guard=Math.max(0,f.guard-.3); else f.guard=Math.min(100,f.guard+.22);
  if(f.blocking){ i.atk=0; i.sp=0; i.jump=0; i.ult=0; f.vx*=.6; return; }
  const a=f.act, dir=(i.right?1:0)-(i.left?1:0);
  if(a&&i.atk&&a.def.chain&&a.t>=3) a.queued=true;
  if(i.inst&&f.ch==='jos'&&!a) josToggle(f);
  if(i.inst&&f.ch==='may'&&!a){ f.catStyle=!f.catStyle; sfx.beep(true); f.catFlash=50; burst(f.x,f.y-90,8,f.catStyle?'#f0a050':'#ffd84d',3,3.5); }

  if(i.ult&&!a&&f.ult>=100&&!f.stun){ f.ult=0; begin(f,SET[f.ch].ult(f)); }
  if(!f.act){
    if(i.atk){ if(dir) f.face=dir; startA(f,1); }
    else if(i.sp){ if(dir) f.face=dir; startSp(f,i.spDir||(i.up?'up':i.down?'down':'b')); }
  }
  if(i.jump&&!f.act) doJump(f);
  i.jump=0; i.atk=0; i.sp=0; i.spDir=null; i.ult=0; i.inst=0;
  const still=f.act&&f.act.def.still;
  if(!still){
    if(dir){
      if(!f.act) f.face=dir;
      const spd=f.speed*(1-.17*Math.min(5,(f.hair||0)+(f.goo>0?2:0)));
      if(f.onGround) f.vx+=(dir*spd-f.vx)*.3;
      else { const m=spd*1.2; if(Math.abs(f.vx)<m||Math.sign(f.vx)!==dir) f.vx+=dir*.42; }
    } else if(f.onGround) f.vx*=.78;
  } else if(f.onGround) f.vx*=.82;
  if(i.down){
    if(!f.onGround&&f.vy>0&&!f.act) f.fast=true;
    else if(f.onGround&&f.onPlat&&!f.act&&!f.downHeld){ f.dropT=14; f.y+=3; f.onGround=false; }
  }
  f.downHeld=i.down;
}
function runAI(f,o){
  const i=f.input, ai=f.ai; ai.t--;
  const dx=o.x-f.x, ad=Math.abs(dx), dy=o.y-f.y;
  i.up=0; i.spH=(f.act&&f.act.def.channel&&f.act.t<46)?1:0;
  const offSide=f.x<STAGE.x-4||f.x>STAGE.x+STAGE.w+4;
  const low=f.y>gy(f.x)+30&&!f.onGround;
  if((offSide&&f.y>gy(f.x)-60)||low){
    const tx=STAGE.x+STAGE.w/2; i.left=f.x>tx+20?1:0; i.right=f.x<tx-20?1:0;
    if(ai.t<=0){
      ai.t=7;
      if(f.vy>0||f.y>gy(f.x)+60){
        if(f.jumpsLeft>0&&!f.act) i.jump=1;
        else if(!f.upUsed&&!f.act){ i.sp=1; i.spDir='up'; }
      }
    }
    return;
  }
  if(ai.t<=0){
    ai.t=5+((Math.random()*8)|0);
    const range=f.ch==='yis'?85:70, r=Math.random();
    ai.mv=ad>range?Math.sign(dx):(r<.25?-Math.sign(dx):0);
    if(!f.act&&f.ult>=100&&ad<380&&r<.5) i.ult=1;
    if(!f.act&&f.ch==='yis'&&Math.random()<.12) i.inst=1;
    if(!f.act&&f.ch==='jos'&&Math.random()<.012) i.inst=1;
    if(!f.act){
      if(ad<range+12&&Math.abs(dy)<70&&r<.55) i.atk=1;
      else if(f.ch==='fer'&&ad<170&&Math.abs(dy)<80&&r<.3) i.sp=1;
      else if(f.ch==='fer'&&ad<100&&r<.4){ i.sp=1; i.spDir='down'; }
      else if(f.ch==='jul'&&ad>140&&ad<420&&Math.abs(dy)<90&&r<.28) i.sp=1;
      else if(f.ch==='jul'&&ad<120&&r<.5){ i.sp=1; i.spDir='down'; }
      else if(f.ch==='seb'&&ad>120&&ad<420&&r<.3) i.sp=1;
      else if(f.ch==='seb'&&ad<150&&r<.4){ i.sp=1; i.spDir='down'; }
      else if(f.ch==='may'&&ad>110&&ad<380&&r<.3) i.sp=1;
      else if(f.ch==='may'&&ad<170&&r<.4){ i.sp=1; i.spDir='down'; }
      else if(f.ch==='jos'&&ad>90&&ad<430&&Math.abs(dy)<110&&r<.4) i.sp=1;
      else if(f.ch==='eps'&&ad>120&&ad<430&&Math.abs(dy)<90&&r<.34) i.sp=1;
      else if(f.ch==='eps'&&ad<115&&r<.3){ i.sp=1; i.spDir='down'; }
      else if(f.ch==='lin'&&ad<110&&r<.3) i.sp=1;
      else if(f.ch==='lin'&&ad<160&&r<.4){ i.sp=1; i.spDir='down'; }
      else if(f.ch==='yis'&&ad>100&&ad<400&&r<.3) i.sp=1;
      else if(f.ch==='yis'&&ad<100&&r<.4){ i.sp=1; i.spDir='down'; }
    }
    if(f.onGround&&dy<-100&&Math.random()<.4) i.jump=1;
    else if(f.onGround&&Math.random()<.05) i.jump=1;
    else if(!f.onGround&&f.jumpsLeft>0&&dy<-80&&Math.random()<.2) i.jump=1;
    if(!f.act&&(i.atk||i.sp||ai.mv===0)) f.face=dx>=0?1:-1;
  }
  if(f.onGround){
    const mg=STAGE.slope?70:25;
    if(STAGE.slope&&ai.mv===0&&f.x>STAGE.x+STAGE.w*.4) ai.mv=-1;
    if(f.x<STAGE.x+mg&&ai.mv<0) ai.mv=0;
    if(f.x>STAGE.x+STAGE.w-mg&&ai.mv>0) ai.mv=0;
  }
  i.left=ai.mv<0?1:0; i.right=ai.mv>0?1:0;
}

let loopId=0;
function startLoop(){
  const id=++loopId;

    let n=0;
    if(G.mode===3){
      while(acc>=16.667&&n<4){ if(!netTick()){ NET.stall++; acc=Math.min(acc,16.667); break; } NET.stall=0; acc-=16.667; n++; }
      const sh=NET.stall>20, wd=NET.desync; if($('stall').hidden===!sh) $('stall').hidden=!sh; if($('netwarn').hidden===wd) $('netwarn').hidden=!wd;
    } else {

    const AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let tries=0;
    const open=()=>{
      let code=''; for(let k=0;k<4;k++) code+=AL[(ORIG_RAND()*AL.length)|0];
      const pr=new Peer('pk'+code,PEER_CFG); NET.peer=pr;
      pr.on('open',()=>{ NET.code=code; lbState('wait',code); });
      pr.on('connection',c=>{ if(NET.conn&&NET.conn.open){ try{ c.close(); }catch(e){} return; } wireConn(c); });
      pr.on('error',e=>{ if(e&&e.type==='unavailable-id'&&tries++<5){ try{ pr.destroy(); }catch(x){} open(); } else { lbState('err','····'); $('lbHost').disabled=false; $('lbJoin').disabled=false; } });
    };
    open();
  }).catch(()=>{ lbState('err','····'); $('lbHost').disabled=false; $('lbJoin').disabled=false; });
}
function netJoin(){
  const code=$('lbIn').value.trim().toUpperCase(); if(code.length<4) return;
  netClose(); NET.host=false; NET.slot=1; NET.my=null; NET.remote=null; lbState('wait',''); $('lbHost').disabled=true; $('lbJoin').disabled=true;
  loadPeer().then(()=>{
    const pr=new Peer(PEER_CFG); NET.peer=pr;
    pr.on('open',()=>{ const c=pr.connect('pk'+code,{reliable:true}); wireConn(c); });
    pr.on('error',()=>{ lbState('err'); $('lbHost').disabled=false; $('lbJoin').disabled=false; });
  }).catch(()=>{ lbState('err'); $('lbHost').disabled=false; $('lbJoin').disabled=false; });
}
function netRematch(){ if(NET.host) hostStart(); else netSend({t:'rq'}); }
$('m3').addEventListener('click',()=>setMode(3));
$('m4').addEventListener('click',()=>setMode(4));
$('lbHost').addEventListener('click',netHost);
$('lbJoin').addEventListener('click',netJoin);
$('lbIn').addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') netJoin(); });
$('lbIn').addEventListener('keyup',e=>e.stopPropagation());
})();
</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prepa Kombat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: menu en una columna (fichas de peleador + ficha de movimientos); juego = marcador, escenario 16:9 y botones tactiles. Look unico y oscuro a proposito: es una pantalla de arcade con el amarillo de las bancas del patio. */
  --ink:#12162b; --ink-2:#1b2145; --ink-3:#252d5e; --line:#323b70;
  --text:#f2f3fb; --muted:#a2a9d6;
  --bench:#f5b800; --bench-text:#251b00; --alert:#ff6a5c;
  --fer:#ff9a3c; --jul:#62a8ff; --yis:#7fe0a6;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:12px;padding-bottom:12px;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{font-family:var(--display);font-weight:400;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bench);outline-offset:2px}

/* ---------- menu ---------- */
#menu{max-width:620px;margin:0 auto;display:grid;gap:18px}
.brand h1{margin:0;font-size:clamp(34px,10vw,54px);line-height:.95;color:var(--bench);letter-spacing:.01em}
.brand p{margin:8px 0 0;color:var(--muted);max-width:44ch}
#menu h2{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.pick{appearance:none;background:var(--ink-2);border:2px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:0}
.pick canvas{width:100%;max-width:76px;height:auto;aspect-ratio:80/96;display:block}
.pick b{font-family:var(--display);font-size:13px;font-weight:400;letter-spacing:.02em}
.pick[aria-checked="true"]{border-color:var(--c);background:var(--ink-3);box-shadow:inset 0 0 0 2px var(--c)}
.ficha{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:grid;gap:8px}
.ficha h3{margin:0;font-size:24px;color:var(--c)}
.ficha .tag{margin:0;font-weight:700;color:var(--text)}
.ficha .desc{margin:0;color:var(--muted)}
.moves{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:7px}
.moves li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:baseline}
.moves kbd{font-family:var(--display);font-size:11px;background:var(--bench);color:var(--bench-text);border-radius:6px;padding:3px 0;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{appearance:none;background:var(--ink-2);border:2px solid var(--line);border-radius:12px;padding:11px 8px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--bench);background:var(--ink-3);color:var(--bench)}
.hint{margin:8px 0 0;color:var(--muted);font-size:14px}
.go{appearance:none;border:0;border-radius:14px;background:var(--bench);color:var(--bench-text);font-family:var(--display);font-size:22px;padding:16px;cursor:pointer;box-shadow:0 5px 0 #a87d00}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a87d00}

/* ---------- seleccion ---------- */
#menu{max-width:640px;margin:0 auto;display:grid;gap:14px;padding-top:6px}
.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.slot{appearance:none;border:3px solid var(--bench);background:var(--ink-2);border-radius:16px;aspect-ratio:1/1.1;display:grid;place-items:end center;cursor:pointer;padding:6px;overflow:hidden;--c:var(--bench)}
.slot.r{border-color:var(--alert);--c:var(--alert)}
.slot.on{box-shadow:0 0 0 4px var(--c),0 0 24px var(--c)}
.slot canvas{width:78%;height:auto;aspect-ratio:80/96;display:block}
.modes{display:grid;gap:8px}
.modes button{appearance:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--ink-2);display:grid;place-items:center;cursor:pointer;padding:0}
.modes svg{width:28px;height:28px;fill:var(--muted)}
.modes button[aria-pressed="true"]{border-color:var(--bench);background:var(--ink-3)}
.modes button[aria-pressed="true"] svg{fill:var(--bench)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.pick{position:relative;appearance:none;background:var(--ink-2);border:3px solid var(--line);border-radius:14px;padding:8px 4px 4px;display:grid;place-items:end center;cursor:pointer;min-width:0;aspect-ratio:1/1.1}
.pick canvas{width:86%;height:auto;aspect-ratio:80/96;display:block}
.pick:hover{border-color:var(--c)}
.pick .tag{position:absolute;top:6px;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.pick .t0{left:6px;background:var(--bench)}.pick .t1{right:6px;background:var(--alert)}
.pick.p0{border-color:var(--bench)}.pick.p1{border-color:var(--alert)}
/* ---------- juego ---------- */
#game{max-width:1100px;margin:0 auto;display:grid;gap:8px;justify-items:center}
.hud{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.pl{background:var(--ink-2);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:4px 10px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"pt pc" "pt st" "ub ub";column-gap:10px;align-items:center;min-width:0}
.pl.r{border-left:1px solid var(--line);border-right:5px solid var(--c);text-align:right;grid-template-columns:1fr auto;grid-template-areas:"pc pt" "st pt" "ub ub"}
.pl .pt{grid-area:pt;width:34px;height:auto;aspect-ratio:80/96;display:block}
.pl .pc{grid-area:pc;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pl .pc small{font-size:14px}
.pl .st{grid-area:st;color:var(--c);letter-spacing:.12em;font-size:12px}
.pl .ub{grid-area:ub;height:7px;border-radius:4px;background:var(--ink);margin-top:4px;overflow:hidden}
.pl .ub i{display:block;height:100%;width:0;background:var(--c);transition:width .1s}
.pl .ub.full i{background:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{opacity:.45}}
.hudbtns{display:grid;gap:6px;align-content:center}
.mini{appearance:none;background:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}
.field{position:relative;line-height:0}
#cv{display:block;border-radius:10px;background:#8fa9c0;touch-action:none}
#over{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:rgba(10,12,28,.72);border-radius:10px;line-height:1.3;padding:16px}
#over h2{margin:0;font-size:clamp(26px,7vw,52px);color:var(--c)}
#over p{margin:0;color:var(--muted)}
#over .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#over .row button{appearance:none;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--ink-3);border:1px solid var(--line)}
#over .row button.main{background:var(--bench);color:var(--bench-text);border-color:var(--bench)}
.keys{margin:0;color:var(--muted);font-size:13px;text-align:center}
body.touch .keys{display:none}

/* ---------- controles tactiles ---------- */
.pad{display:none;width:100%;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
body.touch .pad{display:flex}
body:not(.two) #pad2{display:none!important}
body.two #pad2{transform:rotate(180deg)}
.cl{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
.cr{display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:repeat(3,52px);gap:6px}
.b.ult{background:#ff6a5c;border-color:#ff6a5c;color:#220906;border-radius:26px}
.b.ult.on{background:#fff}
.b{appearance:none;border:2px solid var(--line);background:rgba(37,45,94,.92);color:var(--text);border-radius:50%;display:grid;place-items:center;touch-action:none;cursor:pointer;font-family:var(--display);font-size:11px;padding:0;line-height:1}
.b.on{background:var(--bench);color:var(--bench-text);border-color:var(--bench);transform:scale(.94)}
.b svg{width:26px;height:26px;fill:currentColor}
.b{position:relative}
.b .ar{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:10px;line-height:1}
.mini svg{width:20px;height:20px;fill:currentColor;display:block;margin:0 auto}
.mini{min-width:44px}
#snd[aria-pressed="false"] .w{display:none}
#over canvas{width:min(34%,150px);height:auto;aspect-ratio:160/192}
#over .row button svg{width:26px;height:26px;fill:currentColor;display:block}
.b.u svg{transform:rotate(90deg)}.b.d svg{transform:rotate(-90deg)}.b.rt svg{transform:rotate(180deg)}
.b.a{background:rgba(245,184,0,.92);color:var(--bench-text);border-color:var(--bench)}
.b.a.on{background:#fff}
.cl .bl{grid-column:1;grid-row:1}.cl .u{grid-column:2;grid-row:1}.cl .lf{grid-column:1;grid-row:2}.cl .d{grid-column:2;grid-row:2}.cl .rt{grid-column:3;grid-row:2}
@media (orientation:landscape) and (max-height:520px){
  body.touch .pad{position:fixed;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
  body.touch .pad .b{pointer-events:auto;opacity:.88}
  body.two #pad{right:auto;width:47%;justify-content:flex-start;gap:8px}
  body.two #pad2{left:auto;right:0;width:47%;transform:none;flex-direction:row-reverse;justify-content:flex-start;gap:8px}
  body.two .cl{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:5px}
  body.two .cr{grid-template-columns:repeat(2,44px);grid-template-rows:repeat(3,38px);gap:5px}
  body.two .b svg{width:20px;height:20px}
  .cl{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}
  .cr{grid-template-columns:repeat(2,56px);grid-template-rows:repeat(3,44px)}
}
@media (prefers-reduced-motion:reduce){.go:active,.b.on{transform:none}}
</style>
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<main id="menu">
  <div class="slots">
    <button type="button" class="slot" id="slot0" aria-label="Jugador 1"></button>
    <div class="modes" role="group" aria-label="Modo">
      <button type="button" id="m1" aria-pressed="true" aria-label="Un jugador contra la CPU"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-8 8-8s8 3 8 8z"/></svg></button>
      <button type="button" id="m2" aria-pressed="false" aria-label="Dos jugadores"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3.4"/><circle cx="16.5" cy="9" r="3.4"/><path d="M1.5 20c0-4 3-6.500 6.500-6.500S14.500 16 14.500 20zM10 20c0-4 3-6.500 6.500-6.500S23 16 23 20z"/></svg></button>
    </div>
    <button type="button" class="slot r" id="slot1" aria-label="Jugador 2"></button>
  </div>
  <div class="picks" id="picks" role="listbox" aria-label="Peleadores"></div>
</main>

<div id="game" hidden>
  <div class="hud" id="hud">
    <div class="pl" id="hud0"></div>
    <div class="hudbtns">
      <button type="button" class="mini" id="quit" aria-label="Volver a la selección"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg></button>
      <button type="button" class="mini" id="snd" aria-label="Sonido" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9z"/><path class="w" d="M15 8a5 5 0 010 8M17.500 5a9 9 0 010 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="pl r" id="hud1"></div>
  </div>
  <div class="pad" id="pad2" data-p="1"></div>
  <div class="field">
    <canvas id="cv" aria-label="Escenario de pelea"></canvas>
    <div id="over" hidden>
      <canvas id="overP" width="160" height="192"></canvas>
      <div class="row">
        <button type="button" class="main" id="again" aria-label="Revancha"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 107.500 10.700l-2-.8A6 6 0 1112 6v3l5-4-5-4z"/></svg></button>
        <button type="button" id="back" aria-label="Elegir otro peleador"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></button>
      </div>
    </div>
  </div>
  <div class="pad" id="pad" data-p="0"></div>
</div>

<script>
(function(){
'use strict';
const W=960,H=540,K=1.5,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const cv=$('cv'); cv.width=W*K; cv.height=H*K;
const mctx=cv.getContext('2d');
let ctx=mctx;

/* ================= datos ================= */
const STAGE={x:190,y:410,w:580,h:140};
const PLATS=[{x:262,y:306,w:140},{x:558,y:306,w:140}];
const GR=.56;
const CH={
  fer:{name:'Fer',color:'#ff9a3c',speed:3.7,jump:12.9,weight:1.1},
  jul:{name:'Julián',color:'#62a8ff',speed:4.8,jump:13.6,weight:.92},
  yis:{name:'Yisus',color:'#7fe0a6',speed:4.1,jump:13.2,weight:1.0},
  seb:{name:'Sebastián',color:'#ff7bb0',speed:4.3,jump:13.4,weight:.97},
  lin:{name:'Linnette',color:'#c28bff',speed:4.4,jump:13.5,weight:.93}
};
const ORDER=['fer','jul','yis','seb','lin'];
const INST=['Guitarra','Piano','Batería','Violín','Trompeta','Acordeón'];
const INFO={
  fer:{tag:'Gym rat: todo es ganancia muscular',desc:'Come como Kirby, pero en vez de copiar poderes se pone más grande. Cada gain lo hace pegar más duro y lo vuelve más lento y pesado. Si lo sacan del escenario pierde todo el músculo.',
    moves:[['A','Puñetazo. Con más músculo pega mucho más.'],['B','Aspira (mantén B). Si atrapa al rival: A lo escupe, B o ↓ lo traga y gana +1 músculo.'],['↑ B','Sentadilla. Se agacha y sale disparado hacia arriba.'],['↓ B','Pose de pump. Armadura breve y el siguiente golpe sale reforzado.']]},
  jul:{tag:'Todo es una referencia',desc:'Rápido y ligero. Sus ataques son homenajes al anime.',
    moves:[['A','Combo de tres golpes. Pulsa seguido.'],['B','Kame-Hame. Carga un momento y dispara.'],['↑ B','Paso relámpago. Se teletransporta hacia arriba.'],['↓ B','Jutsu de clones. Un clon corre y golpea.']]},
  yis:{tag:'Oído absoluto',desc:'Toca lo que sea. Cada golpe que conecta sube su racha y su daño hasta ×5. Si lo golpean, la racha se pierde.',
    moves:[['A','Guitarrazo. Muy buen alcance.'],['B','Instrumento. Cambia en cada uso: guitarra, piano, batería, violín.'],['↑ B','Solo. Sube con una ráfaga de notas.'],['↓ B','Bajo. Cae y suelta una onda grave.']]}
};

/* ================= audio ================= */
let AC=null,master=null,muted=false,nbuf=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended'&&AC.resume) AC.resume(); return; }
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AC=new C(); master=AC.createGain(); master.gain.value=.55; master.connect(AC.destination);
    nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){ AC=null; }
}
function tone(fr,dur,type,vol,slide,when){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime+(when||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(fr,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(25,fr*slide),t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
function noise(dur,vol,hp,when){
  if(!AC||muted||!nbuf) return;
  try{
    const t=AC.currentTime+(when||0), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    s.buffer=nbuf; f.type='highpass'; f.frequency.value=hp||800;
    g.gain.setValueAtTime(vol||.2,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.05);
  }catch(e){}
}
const SC=[0,2,4,7,9,12,14,16,19,21];
const RIFF=[0,2,4,2,5,4,2,0,3,5,7,5,4,2,3,1];
const nf=i=>196*Math.pow(2,SC[((i%SC.length)+SC.length)%SC.length]/12);
function yNote(f,kind){
  const i=RIFF[f.noteI++%RIFF.length];
  if(kind==='g'){ tone(nf(i),.4,'triangle',.28); tone(nf(i)*2,.25,'sine',.08); }
  else if(kind==='g3'){ for(let k=0;k<3;k++){ const j=RIFF[(f.noteI+k)%RIFF.length]; tone(nf(j),.3,'triangle',.25,0,k*.06); } f.noteI+=3; }
  else if(kind==='p'){ [0,2,4].forEach(d=>{ const fr=nf(i+d)*.5; tone(fr,.8,'sine',.2); tone(fr*2,.4,'sine',.07); }); }
  else if(kind==='v'){ const fr=nf(i+5); tone(fr*.97,.7,'sawtooth',.09,1.03); tone(fr*2,.7,'sine',.05); }
  else if(kind==='arp'){ for(let k=0;k<5;k++) tone(nf(i+k*2),.22,'triangle',.22,0,k*.05); f.noteI+=2; }
}
const sfx={
  hit(p){ noise(.09,.22+Math.min(.3,p*.02),600); tone(160-Math.min(80,p*4),.12,'square',.18,.5); },
  whoosh(){ noise(.12,.1,1500); },
  jump(){ tone(320,.12,'sine',.12,1.8); },
  ko(){ tone(240,.55,'sawtooth',.25,.3); noise(.4,.3,300); },
  eat(){ tone(520,.08,'square',.14,1.5); tone(780,.1,'square',.14,1.2,.07); },
  charge(){ tone(140,.5,'sawtooth',.1,3); },
  beam(){ tone(620,.5,'sawtooth',.18,.4); noise(.4,.14,400); },
  tp(){ tone(900,.18,'sine',.15,.3); },
  inhale(){ noise(.5,.12,300); tone(200,.5,'sine',.12,1.8); },
  boom(){ tone(90,.35,'sine',.5,.4); noise(.2,.3,200); },
  drum(){ tone(120,.22,'sine',.5,.3); noise(.1,.25,2000,.08); tone(200,.12,'triangle',.2,.5,.1); },
  bass(){ tone(55,.6,'sine',.6,.6); tone(110,.4,'sawtooth',.18,.5); },
  beep(hi){ tone(hi?880:440,.18,'square',.15); }
};

/* ================= utilidades de dibujo ================= */
function circ(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fillStyle=fill; ctx.fill(); }
function ell(x,y,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,TAU); ctx.fillStyle=fill; ctx.fill(); }
function rr(x,y,w,h,r,fill){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); ctx.fillStyle=fill; ctx.fill(); }
function ln(x1,y1,x2,y2,w,col){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineWidth=w; ctx.strokeStyle=col; ctx.lineCap='round'; ctx.stroke(); }

/* ================= pose y peleadores (dibujo) ================= */
function getPose(f){
  const a=f.act;
  const P={hx:9,hy:-28+Math.sin(f.bob*2),hx2:-9,hy2:-30};
  if(f.state==='hurt'){ P.hx=16;P.hy=-62;P.hx2=-15;P.hy2=-58; return P; }
  if(!f.onGround){ P.hy=-38;P.hy2=-40;P.hx=12; }
  else if(Math.abs(f.vx)>.8){ const s=Math.sin(f.walkT); P.hx=6+s*7; P.hx2=-6-s*7; }
  if(a){
    const d=a.def;
    if(d.pose) Object.assign(P,d.pose(f,a));
    else if(d.hits&&d.hits[0]){

const bgc=document.createElement('canvas'); bgc.width=W*K; bgc.height=H*K;
function bld(x,y,w,h,wall,band,dark,win){
  ctx.fillStyle=wall; ctx.fillRect(x,y,w,h);
  const fl=h/3;
  for(let i=0;i<3;i++){
    const fy=y+i*fl;
    for(let wx=x+14;wx<x+w-30;wx+=46){ ctx.fillStyle=win; ctx.fillRect(wx,fy+14,30,fl-44); ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fillRect(wx,fy+14,30,6); }
    ctx.fillStyle=band; ctx.fillRect(x,fy+fl-22,w,10);
    ctx.fillStyle=dark; ctx.fillRect(x,fy+fl-12,w,12);
    ctx.fillStyle='rgba(255,255,255,.5)'; for(let lx=x+30;lx<x+w-20;lx+=92) ctx.fillRect(lx,fy+fl-9,26,3);
  }
  ctx.fillStyle=band; ctx.fillRect(x-6,y-10,w+12,12);
}
function tree(x,top,tw,cx,cy){
  ctx.fillStyle='#2e2622'; ctx.beginPath(); ctx.moveTo(x-tw/2,410); ctx.lineTo(x-tw/3,top); ctx.lineTo(x+tw/3,top); ctx.lineTo(x+tw/2,410); ctx.closePath(); ctx.fill();
  [['#3f7b44',0,0,70],['#4d8b4f',-50,18,56],['#5ea060',48,14,58],['#478749',10,-34,52],['#3a7040',-28,-20,46]].forEach(c=>circ(cx+c[1],cy+c[2],c[3],c[0]));
}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,410); g.addColorStop(0,'#8fa9c0'); g.addColorStop(1,'#dce6ec');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.7; [[150,70,70],[640,50,60],[820,95,50]].forEach(c=>{ ell(c[0],c[1],c[2],c[2]*.32,'#f4f8fb'); ell(c[0]+c[2]*.5,c[1]-6,c[2]*.55,c[2]*.28,'#f4f8fb'); }); ctx.globalAlpha=1;
  bld(-30,150,560,260,'#b3bec8','#8e9aa7','#6f7b88','#4a5866');
  bld(640,205,360,205,'#d8c88c','#3d8f89','#2f6f6b','#5b6b52');
  rr(150,162,170,56,6,'#1d3f8f'); rr(154,166,162,48,4,'#2a55b8'); ctx.fillStyle='#ffffff'; ctx.font='46px Bungee, Impact, sans-serif'; ctx.textAlign='center'; ctx.fillText('ENP',235,203);
  tree(70,150,34,70,100);
  tree(880,170,30,880,120);
  const pg=ctx.createLinearGradient(0,405,0,H); pg.addColorStop(0,'#6a737d'); pg.addColorStop(1,'#3d444d');
  ctx.fillStyle=pg; ctx.fillRect(0,405,W,H-405);
  ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=1; for(let i=0;i<14;i++){ ctx.beginPath(); ctx.moveTo(i*80-20,405); ctx.lineTo(i*80-90+ (i-7)*14,H); ctx.stroke(); }
  // escenario: bloque de concreto con borde amarillo
  const sg=ctx.createLinearGradient(0,STAGE.y,0,STAGE.y+STAGE.h); sg.addColorStop(0,'#d3d6d9'); sg.addColorStop(1,'#8f979e');
  ctx.fillStyle=sg; ctx.fillRect(STAGE.x,STAGE.y,STAGE.w,STAGE.h);
  ctx.strokeStyle='rgba(0,0,0,.14)'; ctx.lineWidth=2; for(let x=STAGE.x+58;x<STAGE.x+STAGE.w;x+=58){ ctx.beginPath(); ctx.moveTo(x,STAGE.y+14); ctx.lineTo(x,STAGE.y+STAGE.h); ctx.stroke(); }
  for(let y=STAGE.y+44;y<STAGE.y+STAGE.h;y+=40){ ctx.beginPath(); ctx.moveTo(STAGE.x,y); ctx.lineTo(STAGE.x+STAGE.w,y); ctx.stroke(); }
  ctx.fillStyle='#f5b800'; ctx.fillRect(STAGE.x-6,STAGE.y,STAGE.w+12,15);
  ctx.fillStyle='#ffd84d'; ctx.fillRect(STAGE.x-6,STAGE.y,STAGE.w+12,4);
  ctx.fillStyle='#b88a00'; ctx.fillRect(STAGE.x-6,STAGE.y+12,STAGE.w+12,3);
  // bancas-jardinera
  PLATS.forEach(p=>{
    ctx.fillStyle='#b88a00'; ctx.fillRect(p.x+8,p.y+10,p.w-16,28);
    ctx.fillStyle='#8f6c00'; ctx.fillRect(p.x+8,p.y+34,p.w-16,4);
    ctx.fillStyle='#f5b800'; rr(p.x,p.y,p.w,12,3,'#f5b800');
    ctx.fillStyle='#ffd84d'; ctx.fillRect(p.x+2,p.y,p.w-4,3);
    circ(p.x+18,p.y-4,9,'#3f7b44'); circ(p.x+30,p.y-8,8,'#4d8b4f'); circ(p.x+p.w-20,p.y-5,9,'#478749');
  });
}
function buildBackground(){

/* ================= fisica ================= */
function settle(e,hw,ignorePlat){
  let landed=false;
  if(e.vy>=0&&G.walls) for(const w of G.walls){ const top=w.y-w.h*Math.min(1,w.age/10); if(e.x+hw>w.x&&e.x-hw<w.x+w.w&&e.py<=top+.5&&e.y>=top){ e.y=top; e.vy=0; return 'plat'; } }
  if(e.vy>=0){
    if(e.x+hw>STAGE.x&&e.x-hw<STAGE.x+STAGE.w&&e.py<=STAGE.y+.5&&e.y>=STAGE.y){ e.y=STAGE.y; e.vy=0; landed='stage'; }
    else if(!ignorePlat){
      for(let i=0;i<PLATS.length;i++){ const p=PLATS[i];
        if(e.x+hw>p.x&&e.x-hw<p.x+p.w&&e.py<=p.y+.5&&e.y>=p.y){ e.y=p.y; e.vy=0; landed='plat'; break; } }
    }
  }
  return landed;
}
function physics(f){
  f.py=f.y; const hw=15*f.s;
  f.vy+=f.fast?GR*1.6:GR;
  const mf=f.fast?19:13.5; if(f.vy>mf) f.vy=mf;
  f.x+=f.vx; f.y+=f.vy;
  if(!f.onGround) f.vx*=.985;
  if(f.x+hw>STAGE.x&&f.x-hw<STAGE.x+STAGE.w&&f.y>STAGE.y+2&&f.py>STAGE.y+2&&f.y-70*f.s<STAGE.y+STAGE.h){
    if(f.x<STAGE.x+STAGE.w/2){ f.x=STAGE.x-hw; if(f.vx>0) f.vx=0; } else { f.x=STAGE.x+STAGE.w+hw; if(f.vx<0) f.vx=0; }
  }
  G.walls.forEach(w=>{ const top=w.y-w.h*Math.min(1,w.age/10);
    if(f.x+hw>w.x&&f.x-hw<w.x+w.w&&f.py>top+2&&f.y-80*f.s<w.y&&f.y>top+2){
      if(f.x<w.x+w.w/2){ f.x=w.x-hw; if(f.vx>0) f.vx=0; } else { f.x=w.x+w.w+hw; if(f.vx<0) f.vx=0; } } });
  if(f.dropT>0) f.dropT--;
  const l=settle(f,hw,f.dropT>0);
  if(l){ f.onGround=true; f.onPlat=(l==='plat'); f.jumpsLeft=1; f.upUsed=false; f.fast=false; }
  else f.onGround=false;
}

function moneyBurst(v){
  for(let k=0;k<9;k++) G.parts.push({x:v.x+rnd(-14,14),y:v.y-rnd(30,80),vx:rnd(-2.6,2.6),vy:rnd(-5,-2),g:.18,life:rnd(34,52),max:52,size:rnd(9,13),col:Math.random()<.5?'#6fcf7a':'#a8e6a0',type:'m',rot:rnd(0,6)});
}
function applyHit(att,v,h){
  if(v.dead||v.invuln>0) return false;
  if(v.act&&v.act.def.counter&&v.act.t>=4&&v.act.t<=34&&!h.counter){
    say(v,'¡ESTÁS PROYECTANDO!','#c9a3ff',20); ring(v.x,v.y-44,'#7ff3ff',90); sfx.tp(); v.ult=Math.min(100,v.ult+10);
    v.act.t=Math.max(v.act.t,35);
    applyHit(v,att,{dmg:h.dmg*1.25+2,kb:6.5,kbg:.1,ang:40,dirX:'away',counter:true}); return true;
  }
  if(v.blocking&&!h.unblock&&(h.dirX==='away'||((h.dirX||1)*v.face<0)||h.dirX===undefined)){
    v.guard-=h.dmg*3; G.hitstop=Math.max(G.hitstop,2); sfx.hit(1); burst(v.x+v.face*24,v.y-44,6,'#9fd0ff',3,3); ring(v.x+v.face*22,v.y-44,'#9fd0ff',34);
    v.x+=(Math.sign(v.x-att.x)||1)*3; v.damage+=h.dmg*.1; att.ult=Math.min(100,att.ult+h.dmg*.5);
    if(v.guard<=0){ v.guard=0; v.blocking=false; v.stun=55; v.state='hurt'; say(v,'¡GUARDIA ROTA!','#ff9a8a',20); }
    return true;
  }
  let dmg=h.dmg*att.dmgMult*((h.pumpable&&att.pump>0)?1.5:1);
  if(h.pumpable&&att.pump>0){ att.pump=0; pop(att.x,att.y-100,'¡PUMP!','#ffc83c',26); }
  const dirX=h.dirX==='face'?att.face:h.dirX==='away'?(Math.sign(v.x-att.x)||att.face):(h.dirX!==undefined?h.dirX:att.face);
  const cx=v.x, cy=v.y-40*v.s;
  if(v.armor){ v.damage+=dmg*.4; burst(cx,cy,6,'#ffd27a',3,3); sfx.hit(3); G.hitstop=Math.max(G.hitstop,2); return true; }
  v.damage+=dmg; att.ult=Math.min(100,att.ult+dmg*2.2); v.ult=Math.min(100,v.ult+dmg*1.4);
  if(v.ch==='yis') moneyBurst(v);
  const total=(h.kb+h.kbg*v.damage)/v.weight, ang=h.ang*Math.PI/180;
  v.vx=Math.cos(ang)*total*dirX; v.vy=-Math.sin(ang)*total;
  v.stun=Math.min(42,Math.floor(total*2.2)+6); v.act=null; v.state='hurt'; v.fast=false; v.flash=8; v.streak=0;
  if(v.ch==='yis') v.dmgMult=1;
  if(att.ch==='yis'){ att.streak=Math.min(5,att.streak+1); att.dmgMult=1+att.streak*.06; if(att.streak>=2) say(att,'RACHA ×'+att.streak,'#7fe0a6',20); }
  G.hitstop=Math.max(G.hitstop,Math.min(9,2+Math.floor(dmg/2.5)));
  G.shake=Math.max(G.shake,Math.min(14,2+dmg*.9));
  burst(cx,cy,8+Math.floor(dmg),'#ffffff',4.2,3.4); burst(cx,cy,5,att.color,3,3); sparks(cx,cy,dmg>=8?12:7,'#fff6c8',22+dmg*1.5); if(dmg>=8) ring(cx,cy,'#ffffff',60);
  pop(cx+rnd(-10,10),cy-34,'+'+Math.round(dmg)+'%',dmg>=9?'#ff7b6b':'#fff',dmg>=9?30:24);
  sfx.hit(dmg);
  return true;
}
function updateAct(f){
  const a=f.act, d=a.def, o=f.opp;
  a.t++;
  if(d.ult&&a.t<d.dur-10) f.armor=true;
  if(d.tick) d.tick(f,a);
  if(!f.act) return;
  if(d.hits) d.hits.forEach((h,idx)=>{
    if(a.t<h.from||a.t>=h.to) return;
    if(h.cond&&!h.cond(f,a)) return;
    const s=f.s, cx=f.x+f.face*h.ox*s, cy=f.y+h.oy*s, hw=h.w*s/2, hh=h.h*s/2;
    f.fx={cx,cy,w:h.w*s,h:h.h*s};
    G.walls.forEach((w,wi)=>{ if(w.owner===f||w.dead) return; const top=w.y-w.h; if(cx+hw>w.x&&cx-hw<w.x+w.w&&cy+hh>top&&cy-hh<w.y){ a.wh=a.wh||new Set(); const key=idx+':'+wi; if(!a.wh.has(key)){ a.wh.add(key); damageWall(w,h.dmg*3); } } });
    if(h.rehit&&(a.t-h.from)%h.rehit===0) a.hit[idx].clear();
    if(o.dead||a.hit[idx].has(o)) return;
    if(cx+hw>o.x-15*o.s&&cx-hw<o.x+15*o.s&&cy+hh>o.y-80*o.s&&cy-hh<o.y){
      if(applyHit(f,o,h)) a.hit[idx].add(o);
    }
  });
  if(a.t>=d.dur){
    if(f.held) freeHeld(f,'free');
    if(a.queued&&d.chain&&d.stage<3) startA(f,d.stage+1);
    else f.act=null;
  }
}
function gainMuscle(f){
  if(f.muscle<5){ f.muscle++; say(f,f.muscle>=5?'¡MODO BESTIA!':'¡GAINS +1!','#ffb37a',24); burst(f.x,f.y-40,12,'#ff9a3c',4,3.5); }
  else say(f,'¡AL MÁXIMO!','#ffb37a',20);
}
function freeHeld(f,mode){
  const o=f.held; if(!o) return; f.held=null;
  o.swallowed=false; o.holder=null; o.invuln=0;
  o.x=f.x+f.face*34*f.s; o.y=f.y; o.py=f.y; o.vx=0; o.vy=0; o.stun=0;
  if(mode==='spit'){ applyHit(f,o,{dmg:9,kb:8,kbg:.13,ang:18,dirX:f.face}); say(f,'¡PTUI!','#ffb37a',26); burst(o.x,o.y-40,10,'#ffd27a',5,3.5); }
  else if(mode==='swallow'){ applyHit(f,o,{dmg:5,kb:3,kbg:.05,ang:60,dirX:f.face}); gainMuscle(f); sfx.eat(); }
  else o.invuln=40;
}
function begin(f,def){
  f.act={def,t:0,hit:(def.hits||[]).map(()=>new Set()),queued:false};
  if(def.cd) f.cds[def.cd]=def.cdT;
  if(def.ult) voice(f.ch+'_ult');
  if(def.onStart) def.onStart(f);
  if(def.snd&&sfx[def.snd]) sfx[def.snd]();
}
function startA(f,stage){ begin(f,SET[f.ch].a(f,stage||1)); }
function startSp(f,dir){
  const key=dir==='up'?'up':dir==='down'?'down':'b';
  if(key==='up'&&f.upUsed) return;
  if(f.cds[key]>0) return;
  begin(f,SET[f.ch][key](f));
}
function shoot(f,p){
  p.owner=f; p.py=p.y; if(p.life===undefined) p.life=60; if(!p.grav) p.grav=0; if(!p.r) p.r=10;
  G.projs.push(p);
}

function damageWall(w,d){
  w.hp-=d; w.shk=6; burst(w.x+w.w/2,w.y-w.h/2,6,'#8fdcff',3.5,3.5); sparks(w.x+w.w/2,w.y-w.h/2,6,'#e6f9ff',24); sfx.hit(2);

}
function buildWall(f){
  const mine=G.walls.filter(w=>w.owner===f);
  if(mine.length>=3){ mine[0].dead=true; burst(mine[0].x+22,mine[0].y-40,8,'#8fdcff',4,3); }
  let x=f.x+f.face*(f.face>0?34:-34-44);
  const o=f.opp;
  for(let t=0;t<3;t++){ if(!o.dead&&o.x+15>x&&o.x-15<x+44&&o.y>f.y-96&&o.y-80<f.y) x+=f.face*52; else break; }
  G.walls.push({x,y:f.y,w:44,h:96,age:0,hp:55,maxhp:55,life:720,owner:f,shk:0});
  G.shake=Math.max(G.shake,4); sfx.boom(); ring(x+22,f.y,'#8fdcff',70); burst(x+22,f.y-10,10,'#8fdcff',4,3);
}
function drawWalls(){
  G.walls.forEach(w=>{
    const g=Math.min(1,w.age/10), h=w.h*g, ox=w.shk>0?rnd(-2,2):0, x=w.x+ox, y=w.y-h;
    ctx.save(); ctx.globalAlpha=w.life<90?(Math.floor(w.life/6)%2?.4:.9):.95;
    rr(x,y,w.w,h,3,'rgba(110,205,255,.62)');
    ctx.strokeStyle='rgba(235,250,255,.8)'; ctx.lineWidth=2; ctx.strokeRect(x+1,y+1,w.w-2,h-2);
    ctx.lineWidth=1; ctx.strokeStyle='rgba(235,250,255,.4)';
    for(let k=1;k<4;k++){ ctx.beginPath(); ctx.moveTo(x,y+h*k/4); ctx.lineTo(x+w.w,y+h*k/4); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(x+w.w/2,y); ctx.lineTo(x+w.w/2,y+h); ctx.stroke();
    if(w.hp<w.maxhp*.55){ ctx.strokeStyle='#14385a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x+8,y+h*.2); ctx.lineTo(x+20,y+h*.45); ctx.lineTo(x+12,y+h*.6); ctx.lineTo(x+30,y+h*.85); ctx.stroke(); }
    if(g<1){ ctx.fillStyle='rgba(255,255,255,'+(1-g)*.6+')'; ctx.fillRect(x,y,w.w,6); }
    ctx.restore();
  });
}
function drawMega(){
  G.fighters.forEach(f=>{
    const a=f.act; if(!a||!a.def.mega||f.dead) return;
    const t=a.t; if(t<56||t>124) return;
    const p=clamp((t-56)/6,0,1), e=t>112?Math.max(0,(124-t)/12):1, th=(86+Math.sin(G.frame*1.3)*10)*p*e;
    if(th<2) return;
    const x0=f.x+f.face*24*f.s, y0=f.y-66*f.s, far=f.face>0?W+60:-60, xs=Math.min(x0,far), wd=Math.abs(far-x0);

function explode(p){
  const o=p.owner.opp; sfx.boom(); G.shake=Math.max(G.shake,11);
  ring(p.x,p.y,'#ffd27a',120); ring(p.x,p.y,'#ff7b3c',80); burst(p.x,p.y,22,'#ff9a3c',7,5); burst(p.x,p.y,10,'#ffe27a',5,4); sparks(p.x,p.y,14,'#fff2b0',60);

function updateProjs(){
  G.projs=G.projs.filter(p=>{
    p.life--; if(p.life<=0){ if(p.type==='clone') burst(p.x,p.y-30,8,'#e8e8e8',3,4); return false; }
    const o=p.owner.opp;
    if(p.homing&&!o.dead){
      const ang=Math.atan2((o.y-40)-p.y,o.x-p.x); let cur=Math.atan2(p.vy,p.vx), d=ang-cur;
      while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU;
      cur+=clamp(d,-.07,.07); p.vx=Math.cos(cur)*p.sp; p.vy=Math.sin(cur)*p.sp;
    }
    p.vy+=p.grav; p.py=p.y; p.x+=p.vx; p.y+=p.vy;
    if(p.type==='clone'){ const l=settle(p,14,false); if(l) p.vy=0; }
    if(p.boom&&p.vy>0&&settle(p,10,false)){ explode(p); return false; }
    if(p.type==='note'&&p.life%5===0&&p.owner.ch==='yis') note(p.x,p.y,p.col);
    if(p.x<-150||p.x>1110||p.y>700||p.y<-300) return false;
    if(!p.boom){ let blocked=false; for(const w of G.walls){ if(w.owner===p.owner||w.dead) continue; const top=w.y-w.h*Math.min(1,w.age/10); if(p.x+p.r*.6>w.x&&p.x-p.r*.6<w.x+w.w&&p.y>top&&p.y<w.y){ damageWall(w,p.type==='beam'?35:(p.hit&&p.hit.dmg||4)*1.6); blocked=true; break; } } if(blocked) return false; }
    if(!o.dead){
      let hit=false;
      if(p.type==='clone'){
        hit=p.x+p.bw/2>o.x-15*o.s&&p.x-p.bw/2<o.x+15*o.s&&p.y>o.y-80*o.s&&p.y-p.bh<o.y;
      } else {
        const rx1=o.x-15*o.s, rx2=o.x+15*o.s, ry1=o.y-80*o.s, ry2=o.y;
        const cx=clamp(p.x,rx1,rx2), cy=clamp(p.y,ry1,ry2);
        hit=(p.x-cx)*(p.x-cx)+(p.y-cy)*(p.y-cy)<=p.r*p.r;
      }

  ctx.save();
  if(g.shake>.5) ctx.translate(rnd(-g.shake,g.shake),rnd(-g.shake,g.shake));
  if((g.zoom||1)>1.003&&g.zc){ const z=g.zoom, cx=clamp(g.zc.x,W/2/z,W-W/2/z), cy=clamp(g.zc.y,H/2/z,H-H/2/z); ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-cx,-cy); }
  ctx.drawImage(bgc,0,0,W,H);
  g.items.forEach(drawItem);
  g.fighters.forEach(f=>{ if(!f.dead&&!f.swallowed) drawFighter(f); });
  g.projs.forEach(drawProj);
  if(g.car) drawCar(g.car);
  drawWalls();
  drawMega();
  g.parts.forEach(p=>{
    const k=p.life/p.max; ctx.globalAlpha=clamp(k,0,1);
    if(p.type==='c') circ(p.x,p.y,p.size*(.4+k*.6),p.col);
    else if(p.type==='r'){ ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(1.2-k),0,TAU); ctx.lineWidth=4*k+1; ctx.strokeStyle=p.col; ctx.stroke(); }
    else if(p.type==='l'){ ctx.strokeStyle=p.col; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(p.x+Math.cos(p.ang)*p.len*(1-k)*.6,p.y+Math.sin(p.ang)*p.len*(1-k)*.6); ctx.lineTo(p.x+Math.cos(p.ang)*p.len,p.y+Math.sin(p.ang)*p.len); ctx.stroke(); }
    else if(p.type==='m'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot+p.life*.18); ctx.fillStyle=p.col; ctx.fillRect(-p.size,-p.size*.5,p.size*2,p.size); ctx.strokeStyle='#2c7a3a'; ctx.lineWidth=1.5; ctx.strokeRect(-p.size,-p.size*.5,p.size*2,p.size); ctx.fillStyle='#2c7a3a'; ctx.font='bold '+Math.round(p.size)+'px system-ui'; ctx.textAlign='center'; ctx.fillText('$',0,p.size*.35); ctx.restore(); }
    else if(p.type==='n'){ ctx.fillStyle=p.col; ctx.font='bold '+p.size+'px system-ui, sans-serif'; ctx.textAlign='center'; ctx.fillText('♪',p.x,p.y); }
    ctx.globalAlpha=1;
  });
  ctx.textAlign='center';
  g.texts.forEach(t=>{
    ctx.globalAlpha=clamp(t.life/(t.max*.5),0,1);
    const age=t.max-t.life, sc=1+.5*Math.max(0,(8-age)/8)+(t.big?.15*Math.sin(age*.6):0);
    ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.rot||0); ctx.scale(sc,sc); const tx0=t.x, ty0=t.y; t.x=0; t.y=0;
    ctx.font=t.size+'px Bungee, Impact, sans-serif';
    ctx.lineWidth=5; ctx.strokeStyle='#0c0f20'; ctx.lineJoin='round'; ctx.strokeText(t.txt,t.x,t.y);
    ctx.fillStyle=t.col; ctx.fillText(t.txt,t.x,t.y); ctx.globalAlpha=1;
    t.x=tx0; t.y=ty0; ctx.restore();
  });
  ctx.restore();
  if(g.dim>0){ ctx.fillStyle='rgba(8,10,24,'+Math.min(.55,g.dim/40)+')'; ctx.fillRect(0,0,W,H); }
  if(g.flash>0){ ctx.fillStyle='rgba(255,255,255,'+(g.flash/14)+')'; ctx.fillRect(0,0,W,H); }
  // indicadores fuera de pantalla
  g.fighters.forEach(f=>{
    if(f.dead) return;
    if(f.x<6||f.x>W-6||f.y<6||f.y>H-6){
      const ix=clamp(f.x,22,W-22), iy=clamp(f.y-40,22,H-22);
      circ(ix,iy,15,f.color); ctx.lineWidth=3; ctx.strokeStyle='#0c0f20'; ctx.beginPath(); ctx.arc(ix,iy,15,0,TAU); ctx.stroke();
    }
  });
  if(g.count>0){
    const n=Math.ceil((g.count-30)/40), txt=n>0?String(n):'';
    ctx.textAlign='center'; ctx.font='120px Bungee, Impact, sans-serif'; ctx.lineWidth=10; ctx.lineJoin='round'; ctx.strokeStyle='#0c0f20';
    ctx.strokeText(txt,W/2,240); ctx.fillStyle='#f5b800'; ctx.fillText(txt,W/2,240);
  }
}
let loopId=0;
function startLoop(){
  const id=++loopId;
  const fn=t=>{
    if(!running||id!==loopId||!G) return;
    const dt=Math.min(100,t-last); last=t; acc+=dt;
    let n=0;
    while(acc>=16.667&&n<4){ step(); acc-=16.667; n++; }
    if(n===4) acc=0;
    draw();
    requestAnimationFrame(fn);
  };
  requestAnimationFrame(fn);
}

/* ================= HUD ================= */
function buildHUD(){
  [0,1].forEach(k=>{
    const el=$('hud'+k), f=G.fighters[k]; el.style.setProperty('--c',f.color);
    el.innerHTML='<canvas class="pt" width="80" height="96"></canvas><div class="pc"></div><div class="st"></div><div class="ub"><i></i></div>';
    portrait(el.querySelector('canvas'),f.ch);
  });
}
function dmgColor(d){ if(d<20) return '#ffffff'; return 'hsl('+clamp(56-(d-20)*.5,0,56)+' 95% 62%)'; }
function updateHUD(){
  [0,1].forEach(k=>{
    const el=$('hud'+k), f=G.fighters[k], pc=el.querySelector('.pc'), ub=el.querySelector('.ub');
    pc.innerHTML=Math.floor(f.damage)+'<small>%</small>'; pc.style.color=dmgColor(f.damage);
    el.querySelector('.st').innerHTML='●'.repeat(Math.max(0,f.stocks))+'○'.repeat(Math.max(0,3-f.stocks));
    ub.classList.toggle('full',f.ult>=100); ub.firstChild.style.width=Math.round(f.ult)+'%';
  });
}
function showOver(){
  const w=G.fighters.find(f=>f.stocks>0)||G.fighters[0];
  const o=$('over'); o.style.setProperty('--c',w.color);
  portrait($('overP'),w.ch);
  o.hidden=false;
}

/* ================= retratos del menu ================= */
function portrait(canvas,ch){
  const c=canvas.getContext('2d'), prev=ctx; ctx=c;
  c.setTransform(2,0,0,2,0,0); c.clearRect(0,0,80,96);
  if(ch==='rnd'){
    c.fillStyle='#f5b800'; c.font='56px Bungee, Impact, sans-serif'; c.textAlign='center'; c.fillText('?',40,68);
  } else if(ch){
    c.save(); c.translate(40,92); c.scale(.98,.98);
    PAINT[ch]({ch,muscle:0,walkT:0,bob:0,onGround:true,vx:0,act:null,state:'idle',pump:0});
    c.restore();
  }
  ctx=prev;
}
/* ================= voces (audios) ================= */
const VOICE_ON=true;
const VOICES={yis_select:2,fer_intro:1};
let curVoice=null;
function voice(name){
  if(!VOICE_ON||muted) return;
  try{
    const n=VOICES[name]; const file=n?name+'_'+(1+((Math.random()*n)|0)):name;
    if(curVoice&&name.indexOf('_select')>0){ try{ curVoice.pause(); }catch(e){} }
    const a=new Audio('voices/'+file+'.mp3'); a.volume=.95; if(name.indexOf('_select')>0) curVoice=a;
    const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{}); a.addEventListener('error',()=>{});
  }catch(e){}
}
/* ================= menu ================= */
let selStep=0, goTimer=0;
function slotFill(el,ch){
  el.innerHTML=''; el.classList.toggle('on',!!ch);
  if(!ch) return;
  const cvs=document.createElement('canvas'); cvs.width=160; cvs.height=192; el.appendChild(cvs); portrait(cvs,ch);
}
function renderPicks(){
  const box=$('picks'); box.innerHTML='';
  ORDER.concat(['rnd']).forEach(ch=>{
    const b=document.createElement('button'); b.type='button'; b.className='pick'; b.setAttribute('role','option');
    b.setAttribute('aria-label',ch==='rnd'?'Al azar':CH[ch].name);
    b.style.setProperty('--c',ch==='rnd'?'#f5b800':CH[ch].color);
    if(pick[0]===ch&&selStep>0) b.classList.add('p0');
    if(pick[1]===ch&&selStep>1) b.classList.add('p1');
    const cvs=document.createElement('canvas'); cvs.width=160; cvs.height=192; b.appendChild(cvs);
    b.addEventListener('click',()=>choose(ch));
    box.appendChild(b); portrait(cvs,ch);
  });
  slotFill($('slot0'),selStep>0?pick[0]:null); slotFill($('slot1'),selStep>1?pick[1]:null);
}
function choose(ch){
  initAudio(); clearTimeout(goTimer);
  if(selStep>=2) selStep=0;
  pick[selStep]=ch; if(ch!=='rnd') voice(ch+'_select');
  selStep++; renderPicks();
  if(selStep===2) goTimer=setTimeout(startGame,700);
}
function setMode(m){
  mode=m; document.body.classList.toggle('two',m===2); $('m1').setAttribute('aria-pressed',String(m===1)); $('m2').setAttribute('aria-pressed',String(m===2));
}
/* ================= entrada ================= */
const K1={KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',KeyF:'atk',KeyG:'sp',KeyH:'ult',KeyR:'inst',KeyB:'block'};
const K2={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyK:'atk',KeyL:'sp',KeyJ:'ult',KeyI:'inst',KeyP:'block'};
const K1X={KeyZ:'atk',KeyX:'sp',Space:'jump',KeyE:'ult',KeyQ:'inst',KeyV:'block'};
function press(inp,act,down){
  if(act==='block'){ inp.block=down?1:0; }
  else if(act==='left'||act==='right'||act==='up'||act==='down'){ if(down&&act==='up'&&!inp.up) inp.jump=1; inp[act]=down?1:0; }
  else if(act==='sp'){ inp.spH=down?1:0; if(down){ inp.sp=1; inp.spDir=inp.up?'up':inp.down?'down':null; } }
  else if(down){
    if(act==='jump') inp.jump=1;
    else if(act==='atk') inp.atk=1;
    else if(act==='ult') inp.ult=1;
    else if(act==='inst') inp.inst=1;
  }
}
function key(e,down){
  if(!G||$('game').hidden) return;
  if(down&&e.repeat){ if(K1[e.code]||K2[e.code]||K1X[e.code]) e.preventDefault(); return; }
  let used=false;
  const a0=G.fighters[0].input, a1=G.fighters[1].input;
  if(G.mode===1){
    const act=K1[e.code]||K2[e.code]||K1X[e.code];
    if(act){ press(a0,act,down); used=true; }
  } else {
    if(K1[e.code]){ press(a0,K1[e.code],down); used=true; }
    if(K2[e.code]){ press(a1,K2[e.code],down); used=true; }
  }
  if(used) e.preventDefault();
}
function padPress(a,down,pl){
  if(!G) return; const inp=G.fighters[pl||0].input;
  if(pl===1&&mode===2&&!matchMedia('(orientation:landscape) and (max-height:520px)').matches){ if(a==='left') a='right'; else if(a==='right') a='left'; }
  if(a==='left'||a==='right'||a==='down') inp[a]=down?1:0;
  else if(a==='block') inp.block=down?1:0;
  else if(a==='sp'||a==='spup'||a==='spdown'){
    inp.spH=down?1:0;
    if(down){ inp.sp=1; inp.spDir=a==='spup'?'up':a==='spdown'?'down':null; }
  }
  else if(!down) return;
  else if(a==='jump') inp.jump=1;
  else if(a==='atk') inp.atk=1;
  else if(a==='ult') inp.ult=1;
  else if(a==='inst') inp.inst=1;
}
function bindPad(){
  document.querySelectorAll('.pad [data-a]').forEach(b=>{
    const a=b.getAttribute('data-a'), pl=+(b.closest('.pad').getAttribute('data-p')||0); let on=false;
    const rel=()=>{ if(!on) return; on=false; b.classList.remove('on'); padPress(a,false,pl); };
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); if(on) return; on=true; b.classList.add('on'); try{ b.setPointerCapture(e.pointerId); }catch(x){} padPress(a,true,pl); });
    b.addEventListener('pointerup',rel); b.addEventListener('pointercancel',rel); b.addEventListener('lostpointercapture',rel);
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
}

/* ================= pantalla ================= */
function fit(){
  if($('game').hidden) return;
  const gm=$('game'), hudH=$('hud').offsetHeight;
  const land=matchMedia('(orientation:landscape) and (max-height:520px)').matches;
  const touch=document.body.classList.contains('touch');
  const padH=(touch&&!land)?$('pad').offsetHeight+8+(mode===2?$('pad2').offsetHeight+8:0):0;
  const keysH=0;
  const aw=gm.clientWidth||innerWidth-32;
  const ah=innerHeight-hudH-padH-keysH-40;
  const s=Math.max(.2,Math.min(aw/W,Math.max(ah,200)/H));
  cv.style.width=Math.floor(W*s)+'px'; cv.style.height=Math.floor(H*s)+'px';
}
function clearInputs(){
  if(!G) return;
  G.fighters.forEach(f=>{ const i=f.input; i.left=i.right=i.up=i.down=i.jump=i.atk=i.sp=i.spH=i.block=0; i.spDir=null; });
}
function startGame(){
  initAudio();
  const c0=pick[0]==='rnd'?ORDER[(Math.random()*ORDER.length)|0]:pick[0];
  const c1=pick[1]==='rnd'?ORDER[(Math.random()*ORDER.length)|0]:pick[1];
  pick[0]=c0;
  newGame(c0,c1,mode);
  $('menu').hidden=true; $('game').hidden=false;
  buildHUD();
  requestAnimationFrame(fit); setTimeout(fit,150); setTimeout(fit,600);
  updateHUD(); fit();
  voice(c0+'_intro'); setTimeout(()=>voice(c1+'_intro'),1300);
  running=true; last=performance.now(); acc=0; startLoop();
}
function toMenu(){
  running=false; clearInputs(); G=null;
  $('game').hidden=true; $('menu').hidden=false; selStep=0; clearTimeout(goTimer); renderPicks();
}

buildBackground();
renderPicks(); setMode(1);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ buildBackground(); renderPicks(); });
$('slot0').addEventListener('click',()=>{ clearTimeout(goTimer); selStep=0; renderPicks(); });
$('slot1').addEventListener('click',()=>{ clearTimeout(goTimer); if(selStep>0){ selStep=1; renderPicks(); } });
$('m1').addEventListener('click',()=>setMode(1));
$('m2').addEventListener('click',()=>setMode(2));
$('quit').addEventListener('click',toMenu);
$('back').addEventListener('click',toMenu);
$('again').addEventListener('click',()=>{ running=false; startGame(); });
$('snd').addEventListener('click',()=>{ muted=!muted; $('snd').setAttribute('aria-pressed',String(!muted)); });
document.addEventListener('keydown',e=>key(e,true));
document.addEventListener('keyup',e=>key(e,false));
window.addEventListener('resize',fit); window.addEventListener('orientationchange',()=>setTimeout(fit,200));
window.addEventListener('blur',clearInputs);
try{ if(matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch'); }catch(e){}
window.addEventListener('touchstart',()=>{ document.body.classList.add('touch'); fit(); },{once:true,passive:true});
const PAD_HTML=`<div class="cl">
      <button type="button" class="b bl" data-a="block" aria-label="Bloquear"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.500 9-8 11-4.500-2-8-6-8-11V5z"/></svg></button>
      <button type="button" class="b u" data-a="jump" aria-label="Saltar"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z"/></svg></button>
      <button type="button" class="b lf" data-a="left" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z"/></svg></button>
      <button type="button" class="b d" data-a="down" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z"/></svg></button>
      <button type="button" class="b rt" data-a="right" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z"/></svg></button>
    </div>
    <div class="cr">
      <button type="button" class="b a" data-a="atk" aria-label="Golpe"><svg viewBox="0 0 24 24"><path d="M12 2l2 6 6-2-3 5.500 5 3.500-6 .5.500 6.500L12 17l-4.500 5 .500-6.500-6-.5 5-3.500L4 6l6 2z"/></svg></button>
      <button type="button" class="b a" data-a="sp" aria-label="Especial"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.300 4.700 1.700 7.200L12 17.800 5.600 21.500l1.700-7.200L2 9.600 9 9z"/></svg></button>
      <button type="button" class="b" data-a="spup" aria-label="Especial arriba"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.300 4.700 1.700 7.200L12 17.800 5.600 21.500l1.700-7.200L2 9.600 9 9z"/><path d="M12 22l-4 0 4-5 4 5z" transform="translate(0,-17) scale(1)" opacity="0"/></svg><i class="ar">▲</i></button>
      <button type="button" class="b" data-a="spdown" aria-label="Especial abajo"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 .6-5.300 4.700 1.700 7.200L12 17.800 5.600 21.500l1.700-7.200L2 9.600 9 9z"/></svg><i class="ar">▼</i></button>
      <button type="button" class="b ult" data-a="ult" aria-label="Ulti"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></button>
      <button type="button" class="b" data-a="inst" id="instBtn" aria-label="Cambiar instrumento"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13h-2V7l-7 1.300V18a3 3 0 11-2-2.800zM18 16a3 3 0 11-2 2.800z"/></svg></button>
    </div>`;
$('pad').innerHTML=PAD_HTML; $('pad2').innerHTML=PAD_HTML;
bindPad();
})();
</script>
